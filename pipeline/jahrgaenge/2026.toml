# Jahrgangsdatei für den Haushalt 2026 der Stadt Hörstel (D-07).
# Jeder PDF-spezifische Wert steht hier, nie im Python-Code. Die Pipeline liest
# diese Datei ausschließlich über ostbevern.konfiguration.lade_jahrgang.
#
# Das PDF ist ein Word-Export von Axians IKVS (software = "ikvs") und nicht wie der
# Ostbevern-Jahrgang ein ProFIS+-Export. Bisher liest die Pipeline aus diesem Layout nur
# die Gesamtpläne (ostbevern.ikvs); die übrigen Schritte folgen. Die frühere
# Ostbevern-Jahrgangsdatei liegt als Referenz für das ProFIS+-Layout unter
# referenz/ostbevern/jahrgaenge/2026.toml.

haushaltsjahr = 2026
software = "ikvs"
pdf_pfad = "raw_data/haushalt-2026.pdf"

[anzahlen]
pdf_seiten = 592
# Teilplanbereich S. 111-566: 16 PB-Teilpläne und 69 Produkte (85 Teilergebnispläne).
produktbereiche = 16
produkte = 69

# Kanonische Spaltenköpfe je Plantyp (Spez. 2.2), wie sie in die Plan-CSVs eingehen.
# Die gedruckten Köpfe der Gesamtpläne stehen unter [layout.ikvs_gesamtplaene]; dort
# heißen die Jahre der mittelfristigen Finanzplanung "Ansatz", in den Teilplänen "Plan".
# Gesamt- und Teilfinanzpläne drucken keine VE-Spalte, nur die Investitionsübersichten.
[spalten]
ergebnisplan = ["Ergebnis 2024", "Ansatz 2025", "Ansatz 2026", "Planung 2027", "Planung 2028", "Planung 2029"]
finanzplan = ["Ergebnis 2024", "Ansatz 2025", "Ansatz 2026", "Planung 2027", "Planung 2028", "Planung 2029"]
investitionen = ["Ergebnis 2024", "Ansatz 2025", "Ansatz 2026", "VE 2026", "Planung 2027", "Planung 2028", "Planung 2029"]

# Seitenbereiche der Kapitel (Spez. 2), 1-basierte PDF-Seiten, aus dem
# Inhaltsverzeichnis S. 2/3 und den Kapitelüberschriften. Es gibt kein Leitbild-Kapitel.
[seitenbereiche]
inhaltsverzeichnis = { von = 2, bis = 3 }
statistik = { von = 4, bis = 6 }
haushaltssatzung = { von = 7, bis = 8 }
# Vorbericht inkl. Kapitel 5 "Position des Ergebnisplanes" (S. 73-78).
vorbericht = { von = 9, bis = 78 }
gesamtergebnisplan = { von = 79, bis = 79 }
gesamtfinanzplan = { von = 80, bis = 81 }
# S. 82-84 Produktübersicht, S. 85-110 Haushaltsquerschnitt je Produktgruppe (Querformat).
querschnitte = { von = 82, bis = 110 }
teilplaene = { von = 111, bis = 566 }
# Stellenplan und Stellenübersicht sind als Bilder ohne Textebene eingebettet (S. 568-574).
stellenplan = { von = 567, bis = 574 }
zuwendungen_fraktionen = { von = 575, bis = 577 }
# Ergebnis- und Finanzrechnung 2024, Bilanz zum 31.12.2024.
jahresabschluss = { von = 578, bis = 585 }
# VE-Übersicht, Verbindlichkeiten, Eigenkapitalentwicklung (S. 588 ist ein Bild).
verpflichtungen_schulden = { von = 586, bis = 588 }
# Beteiligungen und Mitgliedschaften.
wirtschaftsplaene = { von = 589, bis = 592 }

# Kopfzeilen-Muster für die Seitenklassifikation (Spez. 5.3). Das IKVS-Layout hat keine
# laufende Kopfzeile. Geprüft wird gegen den Text der ersten Inhaltszeile(n) einer Seite
# (ostbevern.ikvs_seiten): Trennseiten drucken "Produktbereich" bzw. "Produkt" und darunter
# Code und Name, die zusammengesetzt gegen produktbereich/produkt geprüft werden; die
# Produktinformationen beginnen direkt mit "Produkt 0111101 Name". Die Produktgruppe steht
# nur als Feld der Produktinformationen ("Produkt-" / "01111 Name" / "gruppe").
[kopfzeilen]
produktbereich = '^Produktbereich (\d{2}) (.+)$'
produktgruppe = '^(\d{5}) (.+)$'
produkt = '^Produkt (\d{7}) (.+)$'
fortsetzung = "Fortsetzung folgt"

# Pflichtschlüssel der Jahrgangsdatei; ausgewertet nur vom ProFIS+-Layout. Die IKVS-
# Seitentypen ergeben sich aus den Titeln unter [layout.ikvs_teilplaene].
[kopfzeilen.seitentypen]
produktinformationen = '^Produkt\d{7}'
grundzahlen = '^Kennzahlen'
teilergebnisplan = '^Teilergebnisplan\d'
erlaeuterungen = '^ErläuterungenundHinweise'
teilfinanzplan = '^Teilfinanzplan\d'
investitionen = '^InvestitionsübersichtB'

# [layout.ikvs_gesamtplaene]: gedruckte Spaltenköpfe des Gesamtergebnis- und
# Gesamtfinanzplans (S. 79-81, Bezeichnung und Jahr auf zwei Zeilen). Sie werden
# positionsweise auf die kanonischen [spalten] abgebildet (ostbevern.ikvs).
[layout.ikvs_gesamtplaene]
ergebnisplan_spalten = ["Ergebnis 2024", "Ansatz 2025", "Ansatz 2026", "Ansatz 2027", "Ansatz 2028", "Ansatz 2029"]
finanzplan_spalten = ["Ergebnis 2024", "Ansatz 2025", "Ansatz 2026", "Ansatz 2027", "Ansatz 2028", "Ansatz 2029"]

# [layout.ikvs_teilplaene]: Titel und Spaltenköpfe des Teilplanbereichs (S. 111-566).
# Die Titel-Muster werden gegen Textzeile.text geprüft; Gruppe 1 ist der Code (2-stellig
# PB, 7-stellig Produkt), Gruppe 2 der Name (kann auf der Folgezeile weiterlaufen).
# abschnitt_ende_muster beendet einen offenen Teilplan (Investitionsübersicht,
# Erläuterungen, Trenn- und Produktseiten). Die Spalten werden positionsweise auf die
# kanonischen [spalten] abgebildet ("Plan 2027" = "Planung 2027").
[layout.ikvs_teilplaene]
teilergebnisplan_muster = '^Teilergebnisplan (\d{2}|\d{7}) - (.+)$'
teilfinanzplan_muster = '^Teilfinanzplan (\d{2}|\d{7}) - (.+)$'
investitionen_muster = '^Investitionsübersicht B (\d{7}) - (.+)$'
erlaeuterungen_muster = '^Erläuterungen und Hinweise$'
abschnitt_ende_muster = '^(Investitionsübersicht B \d{7} - |Erläuterungen und Hinweise$|Produktbereich$|Produkt$|Produkt \d{7} |Produktbereich \d{2} )'
spalten = ["Ergebnis 2024", "Ansatz 2025", "Ansatz 2026", "Plan 2027", "Plan 2028", "Plan 2029"]

# [layout.ikvs_querschnitte]: Haushaltsquerschnitte je Produktgruppe und für den
# Gesamthaushalt (S. 85-110). Die Spaltentexte (mehrzeilig gedruckt, zusammengesetzt und
# ohne Leerzeichen/Bindestriche verglichen) werden positionsweise den Kennzahlen
# zugeordnet. wertezeile_woerter sind die Wörter der Zeilenbeschriftung "Plan 2026", die
# im Finanzplanungsblock auch allein auf einer Zeile stehen.
[layout.ikvs_querschnitte]
produktgruppe_muster = '^(\d{5}) - (.+)$'
gesamt_titel = "Gesamthaushalt"
ergebnisplan_titel = "Haushaltsquerschnitt - Ergebnishaushalt"
finanzplan_titel = "Haushaltsquerschnitt - Finanzplanung"
wertezeile_woerter = ["Plan", "2026"]
ergebnisplan_spalten = [
    "Außerordentliches Ergebnis",
    "Ergebnis der laufenden Verwaltungstätigkeit",
    "Ergebnis des Teilhaushaltes (ohne ILV)",
    "Finanzergebnis",
    "Ordentliche Aufwendungen",
    "Ordentliche Erträge",
    "Ordentliches Ergebnis",
]
ergebnisplan_kennzahlen = [
    "ausserordentliches_ergebnis",
    "ergebnis_laufende_verwaltung",
    "ergebnis_teilhaushalt",
    "finanzergebnis",
    "ordentliche_aufwendungen",
    "ordentliche_ertraege",
    "ordentliches_ergebnis",
]
finanzplan_spalten = [
    "Auszahlungen aus Investitionstätigkeit",
    "Auszahlungen aus lfd. Verwaltungstätigkeit",
    "Einzahlungen aus Investitionstätigkeit",
    "Einzahlungen aus lfd. Verwaltungstätigkeit",
    "Finanzmittelüberschuss /-fehlbetrag",
    "Saldo aus Investitionstätigkeit",
    "Saldo aus laufender Verwaltungstätigkeit",
    "Auszahlungen aus Finanzierungstätigkeit gesamt",
    "Einzahlungen aus Finanzierungstätigkeit",
    "Saldo aus Finanzierungstätigkeit",
]
finanzplan_kennzahlen = [
    "auszahlungen_investitionen",
    "auszahlungen_laufende_verwaltung",
    "einzahlungen_investitionen",
    "einzahlungen_laufende_verwaltung",
    "finanzmittelueberschuss",
    "saldo_investitionen",
    "saldo_laufende_verwaltung",
    "auszahlungen_finanzierung",
    "einzahlungen_finanzierung",
    "saldo_finanzierung",
]

# [layout.ikvs_investitionen]: Investitionsübersichten B (Titel siehe
# [layout.ikvs_teilplaene].investitionen_muster). Die VE-Spalte ist ohne Jahr gedruckt
# und entspricht der kanonischen Spalte "VE 2026". massnahme_muster erkennt die
# Maßnahmennummer am Zeilenanfang ("111.02-004", "111.02/1/002", "541.01-3-004"; S. 372
# druckt "424.02.-006" mit überzähligem Punkt).
[layout.ikvs_investitionen]
spalten = ["Ergebnis 2024", "Ansatz 2025", "Ansatz 2026", "VE", "Plan 2027", "Plan 2028", "Plan 2029"]
massnahme_muster = '^\d{3}\.\d{2}\.?[-/][\d/-]+$'

# [layout.ikvs_produktinformationen]: Feldbeschriftungen der Produktinformationen (jede
# allein auf einer Zeile, gegen Textzeile.text geprüft) und Spaltenköpfe der Tabellen
# "Stellenplan" und "Kennzahlen". verantwortlich wird nur erkannt, um den Personennamen
# sofort zu verwerfen (D-09). kennzahl_praefix_muster entfernt die vorangestellte
# Produktnummer ("01.111.07 ") aus der Kennzahlbezeichnung.
[layout.ikvs_produktinformationen]
verantwortlich = "Produktverantwortlicher"
beschreibung = "Beschreibung"
auftragsgrundlage = "Auftragsgrundlage"
zielgruppe = "Zielgruppe"
stellenplan = "Stellenplan"
kennzahlen = "Kennzahlen"
ergaenzend = "Ergänzende Erläuterungen"
stellenplan_spalten = ["Plan 2024", "Plan 2025", "Plan 2026", "Plan 2027", "Plan 2028", "Plan 2029"]
kennzahlen_spalten = ["Ist 2024", "Plan 2025", "Plan 2026", "Plan 2027", "Plan 2028", "Plan 2029"]
kennzahl_praefix_muster = '^\d{2}\.\d{3}\.\d{2}\s+'

# [layout.ikvs_erlaeuterungen]: Titel der Erläuterungsseiten und die Ansatzzeile unter
# jeder Überschrift ("Ansatz 2025 = 4.349 €, Ansatz 2026 = 200 €"). Gedruckt sind auch
# Varianten ohne Komma oder Leerzeichen ("=915.590 €", "235.990€") und mit verschriebenem
# ersten Jahr ("Ansatz 20245=", S. 559). Welcher Wert der Haushaltsjahr-Ansatz ist,
# entscheidet ostbevern.ikvs_produkte._ansatz_haushaltsjahr.
[layout.ikvs_erlaeuterungen]
titel = "Erläuterungen und Hinweise"
ansatz_muster = '^Ansatz (?P<jahr1>\d{4,5}) ?= ?(?P<betrag1>-?\d{1,3}(?:\.\d{3})*) ?€,? Ansatz (?P<jahr2>\d{4}) ?= ?(?P<betrag2>-?\d{1,3}(?:\.\d{3})*) ?€$'

# [layout.weitergabe_kreis_land] (Phase 11, D-01): Die Transferaufwendungen (TP Z. 15) von
# Produkt 1661101 „Steuern, allg. Zuweisungen u. allg. Umlagen“ bestehen ausschließlich aus
# Gewerbesteuerumlage, Allgemeiner Kreisumlage und Jugendamtsumlage (Erläuterungen S. 559/560:
# 2026 23.994.000 EUR = 1.327 + 12.465 + 10.202 T€). posten: Schlüssel in
# transferaufwendungen.csv, namen: Anzeigenamen der App, gleiche Reihenfolge.
[layout.weitergabe_kreis_land]
produkt = "1661101"
posten = ["kreisumlage", "jugendamtsumlage", "gewerbesteuerumlage"]
namen = ["Kreisumlage", "Jugendamtsumlage", "Gewerbesteuerumlage"]

# [layout.schulden] (Phase 11, D-14): Hörstel zählt nur die Investitionskredite (S. 587,
# Zeile 2.5.1); die Verbindlichkeiten aus Transferleistungen sind keine Kredite.
[layout.schulden]
posten = ["kredite_investitionen"]

# [layout.vorbericht] (Phase 11): die manuell abgeschriebenen Vorberichtstabellen. Hörstel
# druckt keine Kita- und Einzelzuschusstabellen und für die Kostenerstattungen nur den
# Gesamtbetrag; dafür die privatrechtlichen Leistungsentgelte (S. 24).
[layout.vorbericht]
einzeltabellen = ["steuerarten", "zuwendungen", "transferaufwendungen", "investitionszuwendungen"]
weitere_tabellen = ["leistungsentgelte", "privatrechtliche_leistungsentgelte", "personal", "sachaufwand", "sonstige_aufwendungen", "sonstige_ertraege"]

# [layout.quellenbelege] (Phase 11, Datenschutz der Belegseiten): `pruefwoerter` markieren
# Belegseiten, die Namen oder Kontaktdaten enthalten könnten (Bericht
# daten/pruefberichte/quellenbelege.md, nur Seite/Stichwort/Zeilenindex). Den Personennamen
# unter „Produktverantwortlicher“ (auf allen 69 Produktinformationsseiten genau eine Zeile)
# schwärzt produkte.personenfeld_rechtecke; `schwaerzen_nach` bleibt deshalb leer (D-09).
[layout.quellenbelege]
pruefwoerter = ["Bürgermeister", "Bürgermeisterin", "Kämmerer", "Kämmerin", "gez.", "Telefon", "E-Mail", "Ansprechpartner", "Sachbearbeit", "Verantwortlich", "Produktverantwortlicher", "Geschäftsführ"]
schwaerzen_nach = []

# [layout.eigenkapital] (Phase 12): Die Spalten der Eigenkapitalübersicht (S. 588) sind Stände
# zum 31.12. des Jahres vor Ergebnisverrechnung (Fußnote 1); das Jahresergebnis derselben
# Spalte ist noch nicht verrechnet. Die App rechnet Polster und Rücklagenabbau danach.
[layout.eigenkapital]
stand = "jahresende_vor_verrechnung"

# [layout.bezugsgroessen] (Phase 12): Produkte mit der berechneten Zeile „Zuschussbedarf je
# Einheit“ (Freigabe 05-03), je Produktcode [Einheit im Zeilennamen, Grundzahl-Bezeichnungen …].
# Hörstel druckt „Produktergebnis je …“ selbst als Grundzahl; die App rechnet deshalb nichts nach.
[layout.bezugsgroessen]

# [layout.kommune] (Phase 12): Name und Art der Kommune für Seitentitel, Kopfzeile und Texte
# der App („Hörstel Money“, „der Stadt Hörstel“).
[layout.kommune]
name = "Hörstel"
art = "Stadt"
